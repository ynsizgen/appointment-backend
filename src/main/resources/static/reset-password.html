<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parola sıfırlama</title>
  <script src="/reset-password.js" defer></script>
</head>
<body>
  <main>
    <h1>Brand hesabınızın parolasını sıfırlayın</h1>
    <p id="status" role="status">Yeni parolanızı girin.</p>
    <form id="reset-form">
      <label for="password">Yeni parola</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <label for="confirmation">Yeni parolayı tekrar girin</label>
      <input id="confirmation" name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button id="submit" type="submit">Parolamı değiştir</button>
    </form>
  </main>
</body>
</html>
